name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run Build
        run: |
          npm run build -w shared
          npm run build -w backend
          npm run build -w frontend

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Frontend Container
        run: docker build -t passcheck-frontend -f docker/frontend.Dockerfile .
        
      - name: Build Backend Container
        run: docker build -t passcheck-backend -f docker/backend.Dockerfile .
